<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FuntimeUA Shop</title>

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#050505;
    font-family:'Montserrat',sans-serif;
    color:white;
    overflow-x:hidden;
}

/* BACKGROUND */

.bg{
    position:fixed;
    width:100%;
    height:100%;
    background:
    linear-gradient(rgba(0,0,0,0.88), rgba(0,0,0,0.93)),
    url('https://images.unsplash.com/photo-1511512578047-dfb367046420?q=80&w=2071&auto=format&fit=crop');
    background-size:cover;
    background-position:center;
    z-index:-1;
}

/* MAIN */

.container{
    width:100%;
    max-width:1300px;
    margin:auto;
    padding:50px 20px 100px;
}

/* TITLE */

.logo{
    text-align:center;
    margin-bottom:70px;
}

.logo h1{
    font-size:130px;
    font-weight:800;
    letter-spacing:8px;
}

.logo p{
    color:#8e8e8e;
    letter-spacing:10px;
    margin-top:10px;
    font-size:22px;
}

/* PRODUCTS */

.products{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(360px,1fr));
    gap:35px;
}

.card{
    background:rgba(0,0,0,0.7);
    border:1px solid rgba(255,255,255,0.08);
    border-radius:24px;
    padding:35px;
    backdrop-filter:blur(10px);
    position:relative;
    overflow:hidden;
}

.card::before{
    content:'';
    position:absolute;
    width:250px;
    height:250px;
    background:rgba(255,255,255,0.03);
    border-radius:50%;
    top:-120px;
    right:-100px;
}

.card h2{
    font-size:48px;
    margin-bottom:25px;
}

.card p{
    color:#9f9f9f;
    line-height:1.7;
    margin-bottom:30px;
}

/* INPUTS */

.input-box{
    margin-top:20px;
}

.input-box label{
    display:block;
    margin-bottom:10px;
    color:#8f8f8f;
    font-size:14px;
}

.input-box input{
    width:100%;
    height:65px;
    background:#101010;
    border:1px solid rgba(255,255,255,0.08);
    border-radius:14px;
    padding:0 20px;
    color:white;
    font-size:18px;
    outline:none;
}

/* COUNTER */

.counter{
    display:flex;
    align-items:center;
    gap:15px;
    margin-top:25px;
}

.counter button{
    width:55px;
    height:55px;
    border:none;
    border-radius:14px;
    background:white;
    color:black;
    font-size:26px;
    font-weight:700;
    cursor:pointer;
}

.counter input{
    width:120px;
    height:55px;
    text-align:center;
    background:#101010;
    border:1px solid rgba(255,255,255,0.08);
    border-radius:14px;
    color:white;
    font-size:22px;
}

/* PRICE */

.price{
    margin-top:30px;
    font-size:18px;
    color:#8f8f8f;
}

.price strong{
    display:block;
    margin-top:10px;
    color:white;
    font-size:52px;
}

/* BUTTON */

.buy-btn{
    width:100%;
    height:80px;
    border:none;
    border-radius:16px;
    background:white;
    color:black;
    font-size:24px;
    font-weight:700;
    margin-top:35px;
    cursor:pointer;
    transition:0.3s;
}

.buy-btn:hover{
    transform:translateY(-3px);
}

/* PAYMENT POPUP */

.popup{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.85);
    display:none;
    align-items:center;
    justify-content:center;
    padding:20px;
    z-index:999;
}

.popup-box{
    width:100%;
    max-width:520px;
    background:#ffffff;
    border-radius:30px;
    color:black;
    overflow:hidden;
}

.popup-header{
    padding:30px;
    border-bottom:1px solid #ececec;
    text-align:center;
}

.popup-header h2{
    font-size:42px;
}

.popup-content{
    padding:30px;
}

.pay-item{
    background:#f5f5f5;
    border-radius:20px;
    padding:25px;
    margin-bottom:20px;
}

.pay-item h4{
    color:#7c7c7c;
    margin-bottom:8px;
}

.pay-item p{
    font-size:34px;
    font-weight:700;
}

.timer{
    margin-top:25px;
    font-size:28px;
    font-weight:700;
    text-align:center;
}

.confirm-btn{
    width:100%;
    height:75px;
    border:none;
    border-radius:18px;
    background:#00a86b;
    color:white;
    font-size:24px;
    font-weight:700;
    cursor:pointer;
    margin-top:30px;
}

/* MOBILE */

@media(max-width:700px){

    .logo h1{
        font-size:70px;
    }

    .products{
        grid-template-columns:1fr;
    }

}

</style>
</head>
<body>

<div class="bg"></div>

<div class="container">

    <div class="logo">
        <h1>FUNTIME</h1>
    </div>

    <div class="products">

        <!-- DK -->

        <div class="card">

            <h2>ДК</h2>

            <p>
                1 ДК = 135 грн
                <br><br>
                2 ДК = 270 грн
                <br>
                5 ДК = 675 грн
                <br>
                10 ДК = 1350 грн
            </p>

            <div class="input-box">
                <label>Ваш ник</label>
                <input type="text" placeholder="Введите ник">
            </div>

            <div class="counter">
                <button onclick="minus('dk')">-</button>

                <input id="dk-count" value="1" oninput="calculate('dk')">

                <button onclick="plus('dk')">+</button>
            </div>

            <div class="price">
                Стоимость:
                <strong id="dk-price">135 грн</strong>
            </div>

            <button class="buy-btn" onclick="openProductPopup('dk')">
    К ОПЛАТЕ
</button>

        </div>

        <!-- BIRZHA -->

        <div class="card">

            <h2>БИРЖА БАЛАНС</h2>

            <p>
                1 Биржа баланс = 1 грн
            </p>

            <div class="input-box">
                <label>Ваш ник</label>
                <input type="text" placeholder="Введите ник">
            </div>

            <div class="counter">
                <button onclick="minus('balance')">-</button>

                <input id="balance-count" value="1" oninput="calculate('balance')">

                <button onclick="plus('balance')">+</button>
            </div>

            <div class="price">
                Стоимость:
                <strong id="balance-price">1 грн</strong>
            </div>

            <button class="buy-btn" onclick="openProductPopup('balance')">
    К ОПЛАТЕ
</button>


        </div>

        <!-- TOKENS -->

        <div class="card">

            <h2>ТОКЕНЫ</h2>

            <p>
                1K токенов = 9 грн
            </p>

            <div class="input-box">
                <label>Ваш ник</label>
                <input type="text" placeholder="Введите ник">
            </div>

            <div class="counter">
                <button onclick="minus('token')">-</button>

                <input id="token-count" value="1" oninput="calculate('token')">

                <button onclick="plus('token')">+</button>
            </div>

            <div class="price">
                Стоимость:
                <strong id="token-price">9 грн</strong>
            </div>

            <button class="buy-btn" onclick="openProductPopup('token')">
    К ОПЛАТЕ
</button>

     </div>

    

<!-- PRODUCT POPUP -->

<div class="popup" id="product-popup">

    <div class="popup-box">

        <div class="popup-header">
            <h2 id="popup-title">ПОКУПКА</h2>
        </div>

        <div class="popup-content">

            <div class="input-box">

                <label>Ваш ник</label>

                <input
                type="text"
                id="popup-nick"
                placeholder="Введите ник">

            </div>

            <div class="input-box" style="margin-top:25px;">

                <label>Количество</label>

                <input
                type="number"
                id="popup-count"
                placeholder="Введите количество"
                oninput="updatePopupPrice()">

            </div>

            <div class="price">

                Стоимость:

                <strong id="popup-price">
                    0 грн
                </strong>

            </div>

            <div class="pay-item" style="margin-top:35px;">

                <h4>Номер карты</h4>

                <p>5218 3200 0047 2125</p>

            </div>

            <div class="pay-item">

                <h4>Владелец карты</h4>

                <p>Kashirin</p>

            </div>

            <button class="confirm-btn" onclick="sendPopupOrder()">
                Я ОПЛАТИЛ
            </button>

        </div>

    </div>

</div>

<script>
let selectedType = '';

let currentProduct = '';
let currentPrice = '';
let currentNickname = '';
let currentAmount = '';

/* OPEN PRODUCT */

function openProductPopup(type){

    selectedType = type;

    document.getElementById('product-popup').style.display = 'flex';

    document.getElementById('popup-count').value = '';
    document.getElementById('popup-price').innerText = '0 грн';
    document.getElementById('popup-nick').value = '';

    if(type === 'dk'){

        document.getElementById('popup-title').innerText = 'ПОКУПКА ДК';

    }

    if(type === 'balance'){

        document.getElementById('popup-title').innerText = 'ПОКУПКА БИРЖА БАЛАНС';

    }

    if(type === 'token'){

        document.getElementById('popup-title').innerText = 'ПОКУПКА ТОКЕНОВ';

    }

}

/* UPDATE PRICE */

function updatePopupPrice(){

    let count = parseInt(document.getElementById('popup-count').value);

    if(isNaN(count) || count < 1){

        document.getElementById('popup-price').innerText = '0 грн';

        return;

    }

    let total = 0;

    if(selectedType === 'dk'){

        total = count * 135;

    }

    if(selectedType === 'balance'){

        total = count * 1;

    }

    if(selectedType === 'token'){

        total = count * 9;

    }

    document.getElementById('popup-price').innerText =
    total + ' грн';

}

/* SEND ORDER */

async function sendPopupOrder(){

    const TOKEN = '8558467067:AAEsv9LHId9xwojnwX04KRbHqAwF9fVJaJc';

    const CHAT_ID = '1053654694';

    let nickname =
    document.getElementById('popup-nick').value;

    let amount =
    document.getElementById('popup-count').value;

    let price =
    document.getElementById('popup-price').innerText;

    let product = '';

    if(selectedType === 'dk'){
        product = 'ДК';
    }

    if(selectedType === 'balance'){
        product = 'Биржа Баланс';
    }

    if(selectedType === 'token'){
        product = 'Токены';
    }

    const text =
`🛒 НОВЫЙ ЗАКАЗ

📦 Товар: ${product}

📊 Количество: ${amount}

💰 Сумма: ${price}

👤 Ник: ${nickname}

⏰ Время: ${new Date().toLocaleString()}
`;

    try{

        await fetch(`https://api.telegram.org/bot${TOKEN}/sendMessage`,{
            method:'POST',
            headers:{
                'Content-Type':'application/json'
            },
            body:JSON.stringify({
                chat_id:CHAT_ID,
                text:text
            })
        });

        document.querySelector('.confirm-btn').style.display = 'none';

        alert('Заказ отправлен!');

        setTimeout(() => {

            document.getElementById('product-popup').style.display = 'none';

            document.querySelector('.confirm-btn').style.display = 'block';

        }, 1000);

    }catch(err){

        alert('Ошибка отправки');

    }

}

/* CLOSE */

document.getElementById('product-popup').addEventListener('click', function(e){

    if(e.target.id === 'product-popup'){

        document.getElementById('product-popup').style.display = 'none';

    }

});
</script>

</body>
</html>
