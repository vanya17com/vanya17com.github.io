<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DonatCase | UAH</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
        }

        body {
            background: #0b0b0f;
            background-image: radial-gradient(circle at 25% 0%, rgba(30, 30, 50, 0.4) 0%, #0b0b0f 80%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem;
        }

        /* стеклянный карточный стиль */
        .glass-card {
            background: rgba(20, 20, 28, 0.75);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 2rem;
            padding: 2rem;
            box-shadow: 0 25px 45px rgba(0, 0, 0, 0.5);
        }

        .container {
            max-width: 500px;
            width: 100%;
        }

        .badge {
            display: inline-flex;
            gap: 0.7rem;
            background: rgba(255, 255, 255, 0.05);
            padding: 0.5rem 1.2rem;
            border-radius: 40px;
            font-size: 0.85rem;
            font-weight: 500;
            margin-bottom: 1.5rem;
        }

        .badge span.active {
            color: #7cffb0;
            border-bottom: 1px solid #7cffb0;
        }

        h1 {
            font-size: 2rem;
            font-weight: 600;
            letter-spacing: -0.02em;
            background: linear-gradient(135deg, #fff, #aaa);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 0.25rem;
        }

        .sub {
            color: #8e8e9e;
            margin-bottom: 2rem;
            font-size: 0.9rem;
        }

        .card-details {
            background: #0f0f14;
            border-radius: 1.5rem;
            padding: 1.5rem;
            margin: 1.8rem 0;
            border: 1px solid #222;
        }

        .card-number {
            font-family: monospace;
            font-size: 1.6rem;
            letter-spacing: 2px;
            font-weight: 500;
            background: #00000040;
            padding: 0.6rem;
            border-radius: 1rem;
            text-align: center;
            margin: 0.5rem 0;
        }

        .row {
            display: flex;
            justify-content: space-between;
            margin: 1rem 0;
            padding: 0.5rem 0;
            border-bottom: 1px solid #222;
        }

        .amount-input {
            background: #1a1a22;
            border: 1px solid #2c2c34;
            padding: 0.8rem 1rem;
            border-radius: 1.2rem;
            font-size: 1.3rem;
            width: 100%;
            color: white;
            font-weight: 500;
            outline: none;
        }

        .timer {
            background: #1a1a22;
            text-align: center;
            padding: 1rem;
            border-radius: 2rem;
            font-size: 2.2rem;
            font-weight: 700;
            font-family: monospace;
            letter-spacing: 5px;
            margin: 1rem 0;
            color: #ffd966;
        }

        .btn {
            background: #7cffb0;
            color: #0b0b0f;
            font-weight: 700;
            padding: 1rem;
            width: 100%;
            border: none;
            border-radius: 2rem;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn:hover {
            background: #5ee09a;
            transform: scale(0.98);
        }

        .warning {
            color: #ffaa66;
            font-size: 0.75rem;
            text-align: center;
            margin-top: 1.2rem;
        }

        .note {
            background: #ffeedd10;
            border-left: 3px solid #ffaa66;
            padding: 0.7rem;
            border-radius: 0.8rem;
            font-size: 0.8rem;
            margin: 1rem 0;
        }

        .product-select {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1rem;
            flex-wrap: wrap;
        }

        .product-btn {
            background: #1e1e26;
            border: none;
            color: #ccc;
            padding: 0.5rem 1rem;
            border-radius: 2rem;
            cursor: pointer;
            transition: 0.1s;
        }

        .product-btn.active {
            background: #7cffb0;
            color: #000;
            font-weight: bold;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="glass-card">
        <div class="badge">
            <span class="active">🇺🇦 UAH</span>
            <span>💳 Карта</span>
        </div>
        <h1>DonateCase</h1>
        <div class="sub">Покупка токенов / кейсов / баланс</div>

        <!-- выбор продукта -->
        <div class="product-select" id="productSelect">
            <button data-product="case" class="product-btn active">🎁 Донат кейс</button>
            <button data-product="tokens" class="product-btn">⚡ Токены</button>
            <button data-product="balance" class="product-btn">💸 Пополнить баланс</button>
        </div>

        <div class="card-details">
            <div class="row">
                <span>💳 Номер карты:</span>
                <strong>5218 3200 0047 2125</strong>
            </div>
            <div class="row">
                <span>👤 Владелец:</span>
                <strong>KASHIRIN</strong>
            </div>
            <div class="row">
                <span>💰 Сумма (UAH):</span>
                <input type="number" id="amountInput" class="amount-input" value="300" step="50">
            </div>
            <div class="note">
                ⚠️ <strong>Комментарий:</strong> НИЧЕГО не пишите. Только сумма.
            </div>
        </div>

        <div class="timer">
            ⏱️ <span id="timer">06:59</span>
        </div>

        <button id="payBtn" class="btn">✅ Я оплатил(а) — проверить</button>
        <div class="warning">
            После нажатия кнопки мы вручную проверим перевод.<br>
            Товар зачислится в течение 15 минут (админ онлайн).
        </div>
    </div>
</div>

<script>
    // ---------- ТАЙМЕР (7 минут) ----------
    let timeLeft = 7 * 60; // 420 секунд
    const timerEl = document.getElementById('timer');

    function updateTimerDisplay() {
        const minutes = Math.floor(timeLeft / 60);
        const seconds = timeLeft % 60;
        timerEl.innerText = `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
    }

    const timerInterval = setInterval(() => {
        if (timeLeft <= 0) {
            clearInterval(timerInterval);
            timerEl.innerText = "00:00";
            alert("Время сессии истекло. Обновите страницу для создания нового запроса.");
        } else {
            timeLeft--;
            updateTimerDisplay();
        }
    }, 1000);

    // ---------- выбор продукта (стилизация) ----------
    let currentProduct = "case"; // case, tokens, balance
    const productBtns = document.querySelectorAll('.product-btn');
    productBtns.forEach(btn => {
        btn.addEventListener('click', () => {
            productBtns.forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            currentProduct = btn.dataset.product;
            // можно менять минимальную сумму под продукт
            const amountInput = document.getElementById('amountInput');
            if (currentProduct === "tokens") amountInput.min = 100;
            else if (currentProduct === "balance") amountInput.min = 50;
            else amountInput.min = 50;
        });
    });

    // ---------- кнопка "я оплатил" ----------
    const payBtn = document.getElementById('payBtn');
    const amountInput = document.getElementById('amountInput');

    payBtn.addEventListener('click', () => {
        let amount = parseFloat(amountInput.value);
        if (isNaN(amount) || amount < 50) {
            alert("❌ Минимальная сумма 50 UAH");
            return;
        }

        // Здесь вы просто сохраняете заявку. Бесплатно можно слать в телеграм бота через Webhook (но это уже доп настройка)
        // Сделаем простой вариант: копируем в буфер и сообщаем пользователю
        const message = `✅ НОВАЯ ЗАЯВКА\nПродукт: ${currentProduct}\nСумма: ${amount} UAH\nВремя: ${new Date().toLocaleString()}\nКарта: 5218 3200 0047 2125`;
        console.log(message);
        
        // Можно открыть почту / ссылку на админа telegram (но проще скопировать данные)
        navigator.clipboard.writeText(message).then(() => {
            alert(`✅ Заявка скопирована! Отправьте её администратору в Telegram/Instagram.\nСумма: ${amount} UAH\nОжидайте начисления вручную.`);
        }).catch(() => {
            alert(`✅ Заявка создана: ${amount} UAH. Свяжитесь с поддержкой (telegram) для проверки.`);
        });

        // Дополнительно: можно обнулить таймер? Нет, пусть остаётся.
    });

    updateTimerDisplay();
</script>
</body>
</html>
